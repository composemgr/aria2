name: aria2
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: p3terx/ariang:latest
    container_name: aria2-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    command: --port 6880 --ipv6
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: aria2-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    depends_on:
      server:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.aria2-app.entrypoints=http'
      - 'traefik.http.routers.aria2-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.aria2-app.middlewares=aria2-app-https-redirect'
      - 'traefik.http.middlewares.aria2-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.aria2-app-secure.entrypoints=https'
      - 'traefik.http.routers.aria2-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.aria2-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.aria2-app-secure.service=aria2-app'
      - 'traefik.http.services.aria2-app.loadbalancer.server.port=6880'
    networks:
      - aria2
      - traefik

  server:
    image: p3terx/aria2-pro:latest
    container_name: aria2-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: aria2-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-0}
      PGID: ${SERVICE_GROUP:-0}
      UMASK_SET: '022'
      RPC_PORT: 6800
      RPC_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      DISK_CACHE: 64M
      IPV6_MODE: 'false'
      LISTEN_PORT: 6888
      UPDATE_TRACKERS: 'true'
      CUSTOM_TRACKER_URL: https://trackerslist.com/all_aria2.txt
    volumes:
      - './volumes/config/aria2:/config'
      - './volumes/data/downloads:/downloads'
    healthcheck:
      test: ['CMD-SHELL', 'timeout 10s bash -c ":> /dev/tcp/127.0.0.1/6800" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - aria2

networks:
  aria2:
    name: aria2
    external: false
  traefik:
    external: true
